name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result
          path: test-results.xml


  dev-deploy:
    name: dev-deploy
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: K8s Cluster Install
        uses: helm/kind-action@v1

      - name: run command on k8s cluster 
        run:  |
              sleep 60
              kubectl -n kube-system get pod
              set +e
              REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
              kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
                --env MONGO_URI=${{ env.MONGO_URI}} \
                --env MONGO_USERNAME=${{ env.MONGO_USERNAME}} \
                --env MONGO_PASSWORD=${{ env.MONGO_PASSWORD}}
              set -e
              echo "kubectl returned $?"
              kubectl -n default get pod
              sleep 10


